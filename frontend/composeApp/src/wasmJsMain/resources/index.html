<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#14161A">
  <title>Events</title>
  <link rel="icon" type="image/svg+xml" href="events_logo.svg">
  <style>
    html,body{margin:0;width:100%;height:100%;background:#14161A;color:#EEF0F4}
    body{overflow:hidden}canvas{outline:none}
    #events-splash{position:fixed;inset:0;display:grid;place-content:center;justify-items:center;gap:12px;background:#14161A}
    #events-splash p{margin:0;font:500 24px/32px system-ui,sans-serif}
    #events-splash svg{animation:appear 250ms ease-out}
    @keyframes appear{from{opacity:0}to{opacity:1}}
    @media(prefers-reduced-motion:reduce){#events-splash svg{animation:none}}
  </style>
</head>
<body>
  <div id="events-splash" role="status" aria-label="Loading Events">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" aria-hidden="true">
      <rect width="96" height="96" rx="24" fill="#14161A"/>
      <path d="M63.56 63.56 A22 22 0 1 1 70 48" fill="none" stroke="#B9A7FF" stroke-width="9" stroke-linecap="round"/>
      <path d="M30 48 H70" fill="none" stroke="#B9A7FF" stroke-width="9" stroke-linecap="round"/>
      <circle cx="78" cy="18" r="6" fill="#F2B872"/>
    </svg>
    <img src="events_wordmark.svg" width="120" height="32" alt="events">
  </div>
  <script src="vent.js"></script>
</body>
</html>
