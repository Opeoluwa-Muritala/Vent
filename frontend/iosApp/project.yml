name: Events
options:
  bundleIdPrefix: app.vent
  deploymentTarget:
    iOS: "16.0"
targets:
  Events:
    type: application
    platform: iOS
    sources:
      - Events
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.vent.events
        INFOPLIST_FILE: Events/Info.plist
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../composeApp/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: "$(inherited) -framework VentKit"
    preBuildScripts:
      - name: Embed Kotlin framework
        script: |
          cd "$SRCROOT/../.."
          ./gradlew :composeApp:embedAndSignAppleFrameworkForXcode
        basedOnDependencyAnalysis: false
