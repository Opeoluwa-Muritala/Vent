name: CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Lint, test, and build
        run: ./gradlew ktlintCheck detekt build check :composeApp:assembleDebug :composeApp:wasmJsBrowserDistribution
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vent-ubuntu-artifacts
          path: |
            **/build/reports/**
            composeApp/build/outputs/apk/debug/*.apk
            composeApp/build/dist/wasmJs/productionExecutable/**
            server/build/install/server/**
  ios:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build iOS simulator framework
        run: ./gradlew :composeApp:linkDebugFrameworkIosSimulatorArm64 :shared-domain:iosSimulatorArm64Test :shared-api:iosSimulatorArm64Test
      - uses: actions/upload-artifact@v4
        with:
          name: vent-ios-framework
          path: composeApp/build/bin/iosSimulatorArm64/debugFramework/**
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, ios]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install --global @railway/cli
      - name: Deploy backend to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_SERVICE: ${{ secrets.RAILWAY_SERVICE }}
        run: railway up --ci --project "$RAILWAY_PROJECT_ID" --environment production --service "$RAILWAY_SERVICE" --message "GitHub $GITHUB_SHA"
      - name: Verify production health
        env:
          VENT_API_URL: ${{ secrets.VENT_API_URL }}
        run: curl --fail --retry 8 --retry-delay 5 --max-time 20 "$VENT_API_URL/api/v1/health"